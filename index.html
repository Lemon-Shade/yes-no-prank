<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riri's Trail 💜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #230046, #8126a8, #d45cba);
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 28px 20px;
  text-align: center;
  background: rgba(25, 0, 40, 0.72);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 24px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
}

h1 {
  font-size: 27px;
  line-height: 1.3;
}

p {
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 22px;
  margin: 8px 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.choice {
  color: #4c1766;
  background: #f5d8ff;
}

.primary {
  color: #381044;
  background: #ff8bd8;
}

#playArea {
  position: relative;
  height: 190px;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 15px;
  background: rgba(255,255,255,0.06);
}

.dodge {
  position: absolute;
  margin: 0;
  transform: none;
  user-select: none;
  -webkit-user-select: none;
}

#secret {
  width: 100%;
  min-height: 110px;
  padding: 12px;
  border: 2px solid #e8b8ff;
  border-radius: 12px;
  font: inherit;
  resize: vertical;
}

.small {
  font-size: 13px;
  opacity: 0.8;
}

</style>
</head>

<body>
<main class="card">
  <div id="quiz"></div>
</main>

<script>
const quiz = document.getElementById("quiz");

function showQuestion(title, content) {
  quiz.innerHTML = `<h1>${title}</h1>${content}`;
}

/* QUESTION 1 */
function question1() {
  showQuestion("Are u male or female? 💜", `
    <p>Of course ur a female, right? 👀</p>
    <button class="choice" onclick="question2()">Male</button>
    <button class="choice" onclick="question2()">Female</button>
  `);
}

/* QUESTION 2: TALL BUTTON DODGES */
function question2() {
  showQuestion("Are u tall or short? 😂", `
    <p>Try choosing Tall... I dare u 🤣🤣</p>
    <div id="playArea">
      <button class="choice dodge" id="tall">Tall</button>
      <button class="choice dodge" id="short">Short</button>
    </div>
  `);

  const area = document.getElementById("playArea");
  const tall = document.getElementById("tall");
  const short = document.getElementById("short");

  let dodges = 0;
  let lastMove = 0;

  function place(button, x, y) {
    const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

    button.style.left = Math.max(0, Math.min(x, maxX)) + "px";
    button.style.top = Math.max(0, Math.min(y, maxY)) + "px";
  }

  function moveTall(event) {
    if (dodges >= 4) return;

    if (event) event.preventDefault();

    const now = Date.now();
    if (now - lastMove < 180) return;
    lastMove = now;

    dodges++;

    const maxX = Math.max(0, area.clientWidth - tall.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - tall.offsetHeight);

    place(
      tall,
      Math.random() * maxX,
      Math.random() * maxY
    );

    if (dodges >= 4) {
      tall.remove();
    }
  }

  place(tall, 15, 20);
  place(short, Math.max(0, area.clientWidth - short.offsetWidth - 15), 115);

  /* PC mouse */
  tall.addEventListener("pointerenter", moveTall);

  /* Phone touch and mouse click */
  tall.addEventListener("pointerdown", moveTall);

  short.addEventListener("click", question3);
}

/* QUESTION 3: YES AND NO BOTH DODGE */
function question3() {
  showQuestion("Do u love me? 😋😋", `
    <p>Catch the answer if u can 😂</p>
    <div id="playArea">
      <button class="choice dodge" id="yes">YES 💗</button>
      <button class="choice dodge" id="no">NO 💔</button>
    </div>
    <p class="small" id="loveHint">These buttons are shy 😭</p>
  `);

  const area = document.getElementById("playArea");
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const hint = document.getElementById("loveHint");

  const buttons = [yes, no];
  let dodges = 0;
  let ready = false;
  let lastMove = 0;

  function place(button, x, y) {
    const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

    button.style.left = Math.max(0, Math.min(x, maxX)) + "px";
    button.style.top = Math.max(0, Math.min(y, maxY)) + "px";
  }

  function moveButtons(event) {
    if (ready) return;

    if (event) event.preventDefault();

    const now = Date.now();
    if (now - lastMove < 180) return;
    lastMove = now;

    dodges++;

    buttons.forEach(button => {
      const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
      const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

      place(
        button,
        Math.random() * maxX,
        Math.random() * maxY
      );
    });

    if (dodges >= 5) {
      ready = true;
      hint.textContent = "Okay okay fine 🤣🤣 Choose your answer!";
    }
  }

  place(yes, 15, 65);
  place(no, Math.max(0, area.clientWidth - no.offsetWidth - 15), 65);

  buttons.forEach(button => {
    button.addEventListener("pointerenter", () => {
      if (!ready) moveButtons();
    });

    button.addEventListener("pointerdown", event => {
      if (!ready) moveButtons(event);
    });

    button.addEventListener("click", () => {
      if (ready) question4();
    });
  });
}

/* QUESTION 4: SECRET ANSWER */
function question4() {
  showQuestion("What's the thing u would say to few close people u trust? 🤫", `
    <p>Come on, tell me your secret 👀</p>
    <form id="secretForm">
      <textarea id="secret" placeholder="Type your answer here..." required></textarea>
      <br>
      <button class="primary" type="submit">Submit 🤭</button>
    </form>
    <p class="small">Your answer isn't sent or saved by this quiz btw.</p>
  `);

  document.getElementById("secretForm").addEventListener("submit", event => {
    event.preventDefault();

    showQuestion("Ayooo chill 😂💀", `
      <p>Your answer was NOT saved! 😭</p>
      <p>But u can screenshot and send it tho... 👀😂💜</p>
      <button class="primary" onclick="question5()">Continue ➜</button>
    `);
  });
}

/* QUESTION 5 */
function question5() {
  showQuestion("Did u enjoy the quiz? 🦚", `
    <button class="choice" onclick="ending()">YES 💜</button>
    <button class="choice" onclick="ending()">NO 🥱😎</button>
  `);
}

/* FINAL SCREEN */
function ending() {
  showQuestion("Well regardless, ur my Shortcake and always will😊 💜", `
    <p>U live for another day 😂</p>
    <p>Ooooh i love u soo much 😘😋😚</p>
    <button class="primary" onclick="question1()">Play Again 🔄</button>
  `);
}

/* START */
question1();
</script>
</body>
</html>
