<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Quiz 💜</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #230046, #8126a8, #d45cba);
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 28px 20px;
  text-align: center;
  background: rgba(25, 0, 40, .65);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 24px;
  box-shadow: 0 12px 35px #21002b66;
}

h1 { font-size: 27px; }
p { line-height: 1.5; }

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 22px;
  margin: 8px 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.choice {
  background: #f5d8ff;
  color: #4c1766;
}

.primary {
  background: #ff8bd8;
  color: #381044;
}

#playArea {
  position: relative;
  min-height: 155px;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 14px;
}

.dodge {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}

#secret {
  width: 100%;
  min-height: 100px;
  padding: 12px;
  border-radius: 12px;
  border: 2px solid #e8b8ff;
  font: inherit;
  resize: vertical;
}

.small { font-size: 13px; opacity: .8; }
</style>
</head>

<body>
<main class="card">
  <div id="quiz"></div>
</main>

<script>
const quiz = document.getElementById("quiz");
let currentQuestion = 1;

function showQuestion(title, content) {
  quiz.innerHTML = `<h1>${title}</h1>${content}`;
}

function question1() {
  currentQuestion = 1;
  showQuestion("Are u male or female? 💜", `
    <button class="choice" onclick="question2('Male')">Male</button>
    <button class="choice" onclick="question2('Female')">Female</button>
  `);
}

function question2(answer) {
  currentQuestion = 2;
  showQuestion("Are u tall or short? 👀", `
    <p>Choose carefully 😂</p>
    <div id="playArea">
      <button class="choice dodge" id="tall">Tall</button>
      <button class="choice dodge" id="short">Short</button>
    </div>
  `);

  const area = document.getElementById("playArea");
  const tall = document.getElementById("tall");
  const short = document.getElementById("short");
  let dodges = 0;
  let lastDodge = 0;

  function place(button, x, y) {
    button.style.transform = "none";
    button.style.left = x + "px";
    button.style.top = y + "px";
  }

  function move(button) {
    const now = Date.now();
    if (now - lastDodge < 250) return;
    lastDodge = now;
    dodges++;

    const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

    place(button, Math.random() * maxX, Math.random() * maxY);

    if (dodges >= 4) tall.remove();
  }

  place(tall, 35, 55);
  place(short, Math.max(0, area.clientWidth - 105), 55);

  tall.addEventListener("pointerenter", move);
  tall.addEventListener("pointerdown", e => {
    if (dodges < 4) {
      e.preventDefault();
      move(tall);
    }
  });

  short.addEventListener("click", () => question3());
}

function question3() {
  currentQuestion = 3;
  showQuestion("Do u love me? 🥹💜", `
    <p>Try catching your answer 😂</p>
    <div id="playArea">
      <button class="choice dodge" id="yes">YES 💗</button>
      <button class="choice dodge" id="no">NO 💔</button>
    </div>
    <p class="small">The buttons are playing hard to get 😭</p>
  `);

  const area = document.getElementById("playArea");
  const buttons = [
    document.getElementById("yes"),
    document.getElementById("no")
  ];
  let dodges = 0;
  let ready = false;
  let lastMove = 0;

  function position(button, x, y) {
    button.style.transform = "none";
    button.style.left = x + "px";
    button.style.top = y + "px";
  }

  function move(button) {
    const now = Date.now();
    if (now - lastMove < 250) return;
    lastMove = now;

    dodges++;

    buttons.forEach((b, i) => {
      const maxX = Math.max(0, area.clientWidth - b.offsetWidth);
      const maxY = Math.max(0, area.clientHeight - b.offsetHeight);
      position(b, Math.random() * maxX, Math.random() * maxY);
    });

    if (dodges >= 5) {
      ready = true;
    }
  }

  buttons.forEach((button, i) => {
    position(button, i === 0 ? 20 : Math.max(0, area.clientWidth - 105), 55);

    button.addEventListener("pointerenter", () => {
      if (!ready) move(button);
    });

    button.addEventListener("pointerdown", e => {
      if (!ready) {
        e.preventDefault();
        move(button);
      }
    });

    button.addEventListener("click", () => {
      if (ready) question4();
    });
  });
}

function question4() {
  currentQuestion = 4;
  showQuestion("What's the thing u would say to few close people u trust? 🤫", `
    <p>Tell me your secret... 👀</p>
    <form id="secretForm">
      <textarea id="secret" placeholder="Type your answer here..." required></textarea>
      <br>
      <button class="primary" type="submit">Submit 🤭</button>
    </form>
    <p class="small">Your answer isn't sent or saved by this quiz.</p>
  `);

  document.getElementById("secretForm").addEventListener("submit", e => {
    e.preventDefault();
    showQuestion("PLOT TWIST 😂", `
      <p>Your answer was NOT saved! 😭💀</p>
      <p>Don't worry, your secret is safe 💜</p>
      <button class="primary" onclick="question5()">Continue ➜</button>
    `);
  });
}

function question5() {
  currentQuestion = 5;
  showQuestion("Did u enjoy the quiz? 🥹", `
    <button class="choice" onclick="ending()">YES 💜</button>
    <button class="choice" onclick="ending()">NO 😭</button>
  `);
}

function ending() {
  showQuestion("Thank u for ur time 💜", `
    <p>U officially survived my little quiz 😂</p>
    <p>Hope I made u smile! 🫶</p>
    <button class="primary" onclick="question1()">Play Again 🔄</button>
  `);
}

question1();
</script>
</body>
</html>
