<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Quiz 💜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #250044, #7415a8, #d16aff);
}

.card {
  width: 100%;
  max-width: 460px;
  min-height: 350px;
  padding: 30px 22px;
  text-align: center;
  background: rgba(35, 0, 55, 0.88);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 25px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.3);
  overflow: hidden;
}

h1 {
  font-size: 27px;
  line-height: 1.3;
}

p {
  line-height: 1.6;
  color: #f0d9ff;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 25px;
  min-height: 65px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: #4b1268;
  background: white;
  touch-action: manipulation;
  user-select: none;
}

button:hover {
  background: #f4dcff;
}

button:focus-visible,
textarea:focus-visible {
  outline: 3px solid #ffdc67;
  outline-offset: 3px;
}

.primary {
  background: #e6a6ff;
  color: #35004d;
}

#heightArea {
  position: relative;
  min-height: 120px;
  margin-top: 20px;
}

#heightArea button {
  position: absolute;
  top: 20px;
}

#tallBtn {
  left: 12%;
}

#shortBtn {
  right: 12%;
}

#loveArea {
  position: relative;
  height: 150px;
  margin-top: 20px;
}

#loveArea button {
  position: absolute;
  top: 35px;
  transition: left 0.12s, top 0.12s;
}

#yesBtn {
  left: 10%;
}

#noBtn {
  left: 58%;
}

textarea {
  width: 100%;
  min-height: 100px;
  padding: 13px;
  margin: 14px 0;
  border: 2px solid #dca6f5;
  border-radius: 12px;
  font: inherit;
  color: #321044;
}

.small {
  font-size: 12px;
  opacity: 0.85;
}

#message {
  min-height: 28px;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

footer {
  margin-top: 25px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>
<main class="card">

  <section id="quiz">
    <p id="progress">QUESTION 1 OF 5</p>
    <h1 id="question"></h1>
    <p id="description"></p>
    <div id="content"></div>
    <p id="message" aria-live="polite"></p>
  </section>

  <section id="ending" class="hidden">
    <h1>Thank u for ur time 💜</h1>
    <p>U officially survived my little quiz 😂</p>
    <p>Hope I made u smile!</p>
    <div class="buttons">
      <button class="primary" id="restartBtn">Take it again 🔄</button>
    </div>
  </section>

  <footer>Made with 💜 and a little mischief</footer>
</main>

<script>
const $ = id => document.getElementById(id);

function showQuestion(number, title, description = "") {
  $("progress").textContent = `QUESTION ${number} OF 5`;
  $("question").textContent = title;
  $("description").textContent = description;
  $("content").replaceChildren();
  $("message").textContent = "";
}

function makeButton(label, action, primary = false) {
  const b = document.createElement("button");
  b.textContent = label;

  if (primary) {
    b.className = "primary";
  }

  b.addEventListener("click", action);
  return b;
}

/* QUESTION 1 */
function genderQuestion() {
  showQuestion(
    1,
    "Are u male or female? 👀",
    "Choose wisely 😂"
  );

  const row = document.createElement("div");
  row.className = "buttons";

  row.append(
    makeButton("Male 🙋‍♂️", heightQuestion),
    makeButton("Female 🙋‍♀️", heightQuestion)
  );

  $("content").append(row);
}

/* QUESTION 2: TALL DISAPPEARS, SHORT STAYS */
function heightQuestion() {
  showQuestion(
    2,
    "Are u tall or short? 📏",
    "Try catching your answer 😭"
  );

  const area = document.createElement("div");
  area.id = "heightArea";

  const tall = makeButton("Tall 📏", () => {});
  const short = makeButton("Short 🤏", heightChosen);

  tall.id = "tallBtn";
  short.id = "shortBtn";

  area.append(tall, short);
  $("content").append(area);

  let dodges = 0;
  let lastDodge = 0;

  function dodgeTall(event) {
    if (tall.dataset.gone === "yes") return;

    // Prevent repeated touch events from counting twice.
    const now = Date.now();
    if (now - lastDodge < 250) return;
    lastDodge = now;

    dodges++;

    if (dodges >= 3) {
      tall.dataset.gone = "yes";
      tall.remove();

      $("message").textContent =
        "TALL HAS LEFT THE CHAT 💀😂";

      return;
    }

    const maxX = Math.max(0, area.clientWidth - tall.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - tall.offsetHeight);

    tall.style.left = Math.random() * maxX + "px";
    tall.style.top = Math.random() * maxY + "px";
  }

  // Computer: move when the mouse approaches.
  tall.addEventListener("pointerenter", event => {
    if (event.pointerType === "mouse") {
      dodgeTall(event);
    }
  });

  // Phone/tablet: move when someone tries to tap Tall.
  tall.addEventListener("pointerdown", event => {
    if (event.pointerType === "touch") {
      event.preventDefault();
      dodgeTall(event);
    }
  });

  const hint = document.createElement("p");
  hint.className = "small";
  hint.textContent = "Go on, try choosing Tall 😂";
  $("content").append(hint);
}

function heightChosen() {
  showQuestion(
    2,
    "Interesting choice... 🤨",
    "I totally won't judge u. Probably."
  );

  $("content").append(
    makeButton("Continue ➜", loveQuestion, true)
  );
}

/* QUESTION 3: YES AND NO CAN DODGE */
function loveQuestion() {
  showQuestion(
    3,
    "Do u love me? 🥹",
    "Both answers are acting suspicious 💀"
  );

  const area = document.createElement("div");
  area.id = "loveArea";

  const yes = makeButton("YES 💗", () => loveAnswer("YES"));
  const no = makeButton("NO 💀", () => loveAnswer("NO"));

  yes.id = "yesBtn";
  no.id = "noBtn";

  area.append(yes, no);
  $("content").append(area);

  setupLoveDodge(yes, area);
  setupLoveDodge(no, area);
}

function setupLoveDodge(button, area) {
  let dodges = 0;
  let lastDodge = 0;

  function dodge() {
    if (button.dataset.ready === "yes") return;

    const now = Date.now();
    if (now - lastDodge < 250) return;
    lastDodge = now;

    dodges++;

    // After three dodges, let the person select the button.
    if (dodges >= 3) {
      button.dataset.ready = "yes";
      $("message").textContent = "Okay, u can catch it now 😭";
      return;
    }

    const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

    button.style.left = Math.random() * maxX + "px";
    button.style.top = Math.random() * maxY + "px";
    button.style.right = "auto";
  }

  button.addEventListener("pointerenter", event => {
    if (event.pointerType === "mouse") dodge();
  });

  button.addEventListener("pointerdown", event => {
    if (
      event.pointerType === "touch" &&
      button.dataset.ready !== "yes"
    ) {
      event.preventDefault();
      dodge();
    }
  });
}

function loveAnswer(answer) {
  showQuestion(
    3,
    answer === "YES" ? "AWWW 😭💗" : "OUCH 💀",
    answer === "YES"
      ? "Don't get too comfortable 😂"
      : "Noted. I will remember this. (Maybe.)"
  );

  $("content").append(
    makeButton("Continue ➜", secretQuestion, true)
  );
}

/* QUESTION 4: THE SECRET ANSWER PRANK */
function secretQuestion() {
  showQuestion(
    4,
    "What's the thing u would say to few close people u trust? 🤫",
    "Tell me something you'd only share with a few people."
  );

  const form = document.createElement("form");

  const answer = document.createElement("textarea");
  answer.placeholder = "Type your answer here...";
  answer.required = true;
  answer.maxLength = 1000;
  answer.setAttribute("aria-label", "Your answer");

  const submit = makeButton(
    "Submit my answer ✨",
    () => {},
    true
  );
  submit.type = "submit";

  form.append(answer, submit);

  form.addEventListener("submit", event => {
    event.preventDefault();

    showQuestion(
      4,
      "LMAOOOO 😭😭",
      "Plot twist: your answer was NOT saved! 😂"
    );

    const joke = document.createElement("p");
    joke.textContent =
      "U really trusted this website huh 💀";
    $("content").append(joke);

    $("content").append(
      makeButton("Continue ➜", enjoyQuestion, true)
    );
  });

  $("content").append(form);

  const note = document.createElement("p");
  note.className = "small";
  note.textContent =
    "Prank note: this demo does not send or store your answer.";
  $("content").append(note);
}

/* QUESTION 5 */
function enjoyQuestion() {
  showQuestion(
    5,
    "Did u enjoy the quiz? 😂",
    "Be honest. I can take it."
  );

  const row = document.createElement("div");
  row.className = "buttons";

  row.append(
    makeButton("YES 😍", ending, true),
    makeButton("NO 😒", ending)
  );

  $("content").append(row);
}

/* FINAL SCREEN */
function ending() {
  $("quiz").classList.add("hidden");
  $("ending").classList.remove("hidden");
}

function restartQuiz() {
  $("ending").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  genderQuestion();
}

$("restartBtn").addEventListener("click", restartQuiz);

genderQuestion();
</script>
</body>
</html>
